<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SyncWave CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2fc;--card:#fff;--ink:#1f2144;--mut:#6b6e93;--line:#e3e2f3;--dark:#17163a;--acc:#5b3df5;--link:#4f46e5;--acc2:#eeebff;--bad:#d6334a;--org:#22d3ee;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12122a;--card:#1b1b38;--ink:#e9e8ff;--mut:#a09fc8;--line:#322f58;--dark:#0d0c25;--acc:#8b7bff;--link:#a99cff;--acc2:#2a2552}}
:root[data-theme="dark"]{--bg:#12122a;--card:#1b1b38;--ink:#e9e8ff;--mut:#a09fc8;--line:#322f58;--dark:#0d0c25;--acc:#8b7bff;--link:#a99cff;--acc2:#2a2552}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Lexend Deca',system-ui,sans-serif;background:var(--dark);color:var(--ink);font-size:14px;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));color:#e8ecef;flex-shrink:0}
.lg{width:150px;font-weight:600;font-size:18px;color:#fff;display:flex;gap:8px;align-items:center;flex-shrink:0}.lg b{color:var(--org);font-size:24px}
#gs{background:#ffffff1f;border:1px solid #ffffff33;color:#fff;border-radius:99px;padding:9px 16px;width:100%}#gs::placeholder{color:#b9c1c7}
.ib,.ib2{all:unset;cursor:pointer;min-width:34px;height:34px;display:grid;place-items:center;border-radius:99px;flex-shrink:0;padding:0 4px}.ib:hover{background:#ffffff1f}.ib2{border:1px solid var(--line);color:var(--ink)}.ib2:hover{background:var(--acc2)}
.chip{all:unset;cursor:pointer;background:linear-gradient(135deg,#6a4cff,#2f9bff);border-radius:99px;padding:7px 14px;white-space:nowrap}.fr{background:#14532d;color:#bbf7d0;border-radius:99px;padding:5px 12px;font-size:12px;white-space:nowrap}
.wrap{flex:1;display:flex;min-height:0}
aside{width:224px;color:#d5dbe0;padding:6px 10px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;transition:width .25s;flex-shrink:0}aside.sm{width:60px}
aside button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:99px;white-space:nowrap}aside button:hover{background:#ffffff14}aside button.on{background:linear-gradient(90deg,#6a4cff,#6a4cff55);color:#fff;font-weight:500}
aside .ic{width:20px;text-align:center;flex-shrink:0}aside .lb{flex:1}aside .gh{opacity:.7}aside .gh .ic{transition:transform .25s}.grp:not(.open) .gh .ic{transform:rotate(-90deg)}
aside hr{border:0;border-top:1px solid #ffffff26;margin:8px 4px}aside .free{font-size:10px;background:#14532d;color:#bbf7d0;border-radius:99px;padding:1px 7px}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}.grp.open .sub{grid-template-rows:1fr}.sub>div{overflow:hidden}
.setup{background:#fff;color:#222;border-radius:12px;padding:12px;font-size:13px;display:grid;gap:8px}.btn.dk{background:#222;color:#fff;border-color:#222}
aside.sm .lb,aside.sm .free,aside.sm .setup{display:none}aside.sm button{justify-content:center}
.pg{height:6px;background:#0002;border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,#6a4cff,#22d3ee);transition:width .4s}.pg.big{margin:10px 0 4px}
main{flex:1;min-width:0;overflow:auto;background:var(--bg);border-radius:18px 0 0 0}
.panel{background:var(--card);border-radius:16px;margin:12px;padding:20px 26px;min-height:calc(100% - 24px)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:24px;font-weight:400;margin:0}h2{font-weight:400;margin:0 0 6px;font-size:22px}.acts{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}.tabs button{all:unset;cursor:pointer;padding:10px 16px;border-radius:8px 8px 0 0;color:var(--mut);white-space:nowrap}.tabs button.on{background:var(--acc2);color:var(--ink);box-shadow:inset 0 -2px var(--acc)}
.tools,.chips{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}.tools input,.tools select,.chips select{width:auto;border-radius:99px}.tools .sr{width:260px}
.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px}.btn.p{background:linear-gradient(135deg,#6a4cff,#2f9bff);border-color:transparent;color:#fff;font-weight:500}.btn.on{background:var(--acc2)}.btn.s{padding:3px 12px;font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.seg button{all:unset;cursor:pointer;padding:6px 12px}.seg .on{background:var(--acc2)}
.tw{overflow-x:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-weight:500;color:var(--mut);font-size:13px}tr:hover>td{background:var(--acc2)}input[type=checkbox]{width:auto}
.lk{color:var(--link);font-weight:500;cursor:pointer;text-decoration:none}.lk:hover{text-decoration:underline}.dn{text-decoration:line-through;color:var(--mut)}.mut{color:var(--mut)}
.wa{font-size:10px;background:#16a34a;color:#fff;border-radius:99px;padding:1px 6px;text-decoration:none}
.tag{all:unset;padding:2px 10px;border-radius:99px;background:var(--acc2);color:var(--link);font-size:12px;font-weight:500}button.tag{cursor:pointer}.tag.op{background:#fff1e0;color:#b45309}
.x{all:unset;cursor:pointer;color:var(--mut);padding:4px 8px;border-radius:6px}.x:hover{color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:center;padding-top:14px;gap:8px;flex-wrap:wrap}.pill{background:var(--acc2);border-radius:99px;padding:7px 16px;font-weight:500}.foot span:last-child{display:flex;gap:8px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px}.kpi{font-size:26px;font-weight:500;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar{height:8px;background:linear-gradient(90deg,#6a4cff,#22d3ee);border-radius:4px}
.hero{background:linear-gradient(135deg,var(--acc2),transparent);border-radius:14px;padding:24px}.hero .btn{margin:8px 8px 0 0}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}.col{min-width:230px;flex:1;background:var(--bg);border-radius:12px;padding:10px;min-height:220px}.col h3{margin:0 0 8px;font-size:13px;font-weight:500;display:flex;justify-content:space-between}.col.over{outline:2px dashed var(--acc)}
.deal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;display:grid;gap:2px}.deal:hover{border-color:var(--acc);box-shadow:0 4px 12px #0001}
.dd{position:relative}#gr,.menu{display:none;position:absolute;top:42px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0003;z-index:15;overflow:hidden;padding:4px}#gr{left:0;right:0}.menu{right:0;min-width:180px}.menu.on{display:block}.menu.w{min-width:280px}
.menu button,.hit,.ni{all:unset;display:block;width:100%;padding:8px 10px;border-radius:6px;cursor:pointer;box-sizing:border-box}.menu button:hover,.hit:hover{background:var(--acc2)}.ni{cursor:default;font-size:13px}
#ov{position:fixed;inset:0;background:#0006;display:none;z-index:20}#ov.on{display:flex;justify-content:flex-end}
#ov form,#ov .m{background:var(--card);height:100%;width:420px;max-width:100%;padding:22px;display:grid;gap:12px;align-content:start;overflow:auto;animation:sl .25s}@keyframes sl{from{transform:translateX(30px);opacity:0}}
label{display:grid;gap:4px;font-size:12px;color:var(--mut)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--dark);border:1px solid #ffffff22;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;animation:sl .25s;max-width:90%}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media(max-width:860px){.two{grid-template-columns:1fr}.panel{padding:16px;margin:8px}.lg span,.chip,.fr{display:none}.tools .sr{width:100%}}
#auth{position:fixed;inset:0;z-index:50;display:none;background:var(--bg)}
.ab{flex:1;background:linear-gradient(160deg,#17163a,#3b2bb8 62%,#1fa2ff);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:12px}.ab h2{font-size:38px;font-weight:400;line-height:1.2;margin:0}.ab p{color:#b9c1c7;max-width:380px}
.af{flex:1;display:grid;place-items:center;padding:24px;overflow:auto}.af form{width:390px;max-width:100%;display:grid;gap:12px;background:var(--card);padding:28px;border-radius:16px;border:1px solid var(--line)}
.err{background:#fde8e6;color:#9b2c22;border-radius:8px;padding:9px 12px;font-size:13px}.ck{display:flex;align-items:center;gap:8px}.av{background:var(--acc);color:#fff;font-weight:600}
@media(max-width:860px){.ab{display:none}}
.btn,.ib,.ib2,.tabs button,aside button,.deal,.card,.chip{transition:transform .15s,box-shadow .15s,background .15s,filter .15s}
.btn:hover,.chip:hover{transform:translateY(-1px);box-shadow:0 6px 16px #5b3df540}.btn.p:hover,.chip:hover{filter:brightness(1.1)}.btn:active{transform:none}
.card:hover{box-shadow:0 8px 24px #5b3df522;transform:translateY(-2px)}.tabs button:hover{color:var(--ink)}.lg b{text-shadow:0 0 14px #22d3ee}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #5b3df540}
</style></head><body>
<div id="top"></div><div class="wrap"><aside id="nav"></aside><main id="app"></main></div><div id="ov"></div><div id="auth"></div>
<script>
const BS=['New','Open','In progress','Qualified','Unqualified','Customer'],DS=['New','Qualified','Proposal','Negotiation','Won','Lost'],OW=['','Me'];
const F={contacts:[['name','Name'],['email','Email','email'],['phone','Phone number'],['owner','Contact owner',OW],['company','Primary company'],['status','Lead status',BS]],
companies:[['name','Company name'],['owner','Company owner',OW],['phone','Phone number'],['industry','Industry'],['city','City'],['status','Lead status',BS]],
deals:[['name','Deal name'],['amount','Amount (₹)','number'],['stage','Deal stage',DS],['contact','Contact'],['owner','Deal owner',OW],['close','Close date','date']],
tasks:[['title','Task'],['due','Due date','date'],['owner','Assigned to',OW],['done','Status','x']],
segments:[['name','Segment name'],['crit','Lead status',['Any',...BS]]],
emails:[['name','Email name'],['subject','Subject line'],['segment','Segment'],['status','Status',['Draft','Scheduled','Sent']]],
agents:[['name','Agent name'],['target','Target audience'],['status','Status',['Active','Paused']],['leads','Leads found','number']],
workflows:[['name','Workflow name'],['trigger','Trigger',['Contact created','Deal stage changed','Meeting booked','Task overdue']],['action','Action',['Create follow-up task','Send email','Notify Slack','Update stage']],['status','Status',['Active','Paused']]],
meetings:[['title','Meeting title'],['date','Date','date'],['time','Time','time'],['contact','Contact'],['link','Meeting link']]};
const T={contacts:'contact',companies:'company',deals:'deal',tasks:'task',segments:'segment',emails:'marketing email',agents:'agent',workflows:'workflow',meetings:'meeting'};
const PL={contacts:'contacts',companies:'companies',deals:'deals',tasks:'tasks',segments:'segments',emails:'emails',agents:'agents',workflows:'workflows',meetings:'meetings'};
const TL={home:'Home',contacts:'Contacts',companies:'Companies',deals:'Deals',tasks:'Tasks',segments:'Segments',emails:'Marketing Emails',agents:'Prospecting Agent',workflows:'Workflows',meetings:'Calendar',dashboard:'Dashboards',users:'Users & access'};
const NV=[['home','Home','⌂'],['contacts','Contacts','☷'],['companies','Companies','▥'],['deals','Deals','◈'],['tasks','Tasks','☑'],['segments','Segments','◫']];
const GR=[['Marketing',[['emails','Marketing Emails','✉']]],['Sales',[['agents','Prospecting Agent','◎']]],['Platform',[['workflows','Workflows','⚙']]],['More',[['meetings','Calendar','▣'],['dashboard','Dashboards','▦']]]];
const BRD={contacts:['status',BS],companies:['status',BS],deals:['stage',DS]},CR=['contacts','companies','deals','segments','emails','agents','workflows'];
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const day=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')};
const fd=t=>{if(!t)return '--';const d=new Date(t);return new Date().toDateString()==d.toDateString()?'Today at '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
const V={contacts:[['All contacts',()=>1],['My contacts',r=>r.owner=='Me'],['Unassigned contacts',r=>!r.owner]],companies:[['All companies',()=>1],['My companies',r=>r.owner=='Me']],deals:[['All deals',()=>1],['My deals',r=>r.owner=='Me']],
tasks:[['All tasks',()=>1],['Due tasks',r=>!r.done&&r.due==day(0)],['Overdue tasks',r=>!r.done&&r.due&&r.due<day(0)],['Upcoming tasks',r=>!r.done&&r.due>day(0)]]};
function seed(){const t=Date.now(),h=36e5;return{contacts:[{id:uid(),name:'Aarav Mehta',email:'aarav@northwind.in',phone:'9810011122',owner:'Me',company:'Northwind',status:'Qualified',created:t-30*h},{id:uid(),name:'Priya Nair',email:'priya@zenfab.com',phone:'9873055501',owner:'',company:'ZenFab',status:'New',created:t-5*h},{id:uid(),name:'Rohan Gupta',email:'rohan@skyline.io',phone:'9911020230',owner:'Me',company:'Skyline',status:'Customer',created:t-96*h}],
companies:[{id:uid(),name:'Northwind',owner:'Me',phone:'',industry:'Logistics',city:'Gurugram',status:'Open',created:t-30*h},{id:uid(),name:'ZenFab',owner:'',phone:'',industry:'Manufacturing',city:'Pune',status:'New',created:t-5*h},{id:uid(),name:'Skyline',owner:'Me',phone:'',industry:'Software',city:'Bengaluru',status:'Customer',created:t-96*h}],
deals:[{id:uid(),name:'Northwind fleet plan',amount:450000,stage:'Proposal',contact:'Aarav Mehta',owner:'Me',close:day(21),created:t-28*h},{id:uid(),name:'ZenFab pilot',amount:120000,stage:'New',contact:'Priya Nair',owner:'',close:day(30),created:t-4*h},{id:uid(),name:'Skyline renewal',amount:800000,stage:'Won',contact:'Rohan Gupta',owner:'Me',close:day(-3),created:t-90*h}],
tasks:[{id:uid(),title:'Send proposal to Northwind',due:day(2),owner:'Me',done:false,created:t-h},{id:uid(),title:'Call Priya about pilot',due:day(0),owner:'Me',done:false,created:t-2*h},{id:uid(),title:'Follow up Skyline invoice',due:day(-1),owner:'',done:false,created:t-3*h}],
segments:[{id:uid(),name:'Hot leads',crit:'Qualified',created:t-h},{id:uid(),name:'All customers',crit:'Customer',created:t-h}],
emails:[{id:uid(),name:'October newsletter',subject:'What’s new at SyncWave',segment:'All customers',status:'Scheduled',created:t-h}],
agents:[{id:uid(),name:'Logistics decision-makers',target:'Ops heads, India',status:'Active',leads:34,created:t-h}],
workflows:[{id:uid(),name:'Welcome new leads',trigger:'Contact created',action:'Create follow-up task',status:'Active',created:t-h}],
meetings:[{id:uid(),title:'Discovery call · Northwind',date:day(0),time:'11:00',contact:'Aarav Mehta',link:'meet.google.com/abc-defg-hij'},{id:uid(),title:'Pilot scoping · ZenFab',date:day(1),time:'15:30',contact:'Priya Nair',link:'meet.google.com/xyz-uvwx-rst'}],
int:{Slack:false,'Google Calendar':false,Gmail:false},did:{},log:[{t:t,m:'Workspace created with sample data'}]}}
let S,KEY,ME=null,CFN,view='home',q='',TB={},FL={},SO='new',MODE='table',SHOWF=false,SEL=new Set(),OP={Marketing:1,Sales:1,Platform:1,More:1},col=innerWidth<860;
const save=()=>{if(!KEY)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const log=m=>{S.log.unshift({t:Date.now(),m});S.log=S.log.slice(0,20);toast(m)};
const steps=()=>[['Add your first contact',S.did.contacts,"form('contacts')"],['Import contacts from CSV',S.did.import,'imp()'],['Create a deal',S.did.deals,"form('deals')"],['Book a meeting',S.did.meetings,"form('meetings')"],['Connect Google Calendar',S.int['Google Calendar'],"tgl('Google Calendar')"]];
const pct=()=>Math.round(steps().filter(s=>s[1]).length/5*100);
function nav(){const n=document.getElementById('nav');n.className=col?'sm':'';const it=([k,l,i])=>`<button class="${view==k?'on':''}" onclick="go('${k}')" title="${l}"><span class="ic">${i}</span><span class="lb">${l}</span>${k=='agents'||k=='workflows'?'<small class="free">Free</small>':''}</button>`;
n.innerHTML=it(NV[0])+'<hr>'+NV.slice(1).map(it).join('')+GR.map(([g,l])=>`<div class="grp ${OP[g]||l.some(x=>x[0]==view)?'open':''}"><button class="gh" onclick="tg(this,'${g}')"><span class="ic">⌄</span><span class="lb">${g}</span></button><div class="sub"><div>${l.map(it).join('')}</div></div></div>`).join('')+`<div style="flex:1"></div><div class="setup"><b>Complete your setup and reach your goals faster.</b><div class="pg"><i style="width:${pct()}%"></i></div><button class="btn dk" style="justify-content:center" onclick="go('home')">Continue · ${pct()}%</button></div>`}
function tg(e,g){if(col){col=false;OP[g]=true;nav();return}const p=e.parentElement;p.classList.toggle('open');OP[g]=p.classList.contains('open')}
const qc=()=>[['contacts','Contact'],['companies','Company'],['deals','Deal'],['tasks','Task'],['meetings','Meeting'],['segments','Segment']].map(([k,n])=>`<button onclick="form('${k}')">${n}</button>`).join('');
function bar(){document.getElementById('top').innerHTML=`<button class="ib" onclick="col=!col;nav()" aria-label="Toggle menu">☰</button><div class="lg"><b>≋</b><span>SyncWave</span></div><div class="dd" style="flex:1;max-width:620px"><input id="gs" placeholder="Find in SyncWave" oninput="gsearch(this.value)" aria-label="Global search"><div id="gr"></div></div><button class="chip" onclick="ask()">✦ SyncWave Assistant</button><span style="flex:1"></span><span class="fr">Free forever</span><div class="dd"><button class="ib" onclick="menu('qc')" title="Quick create" aria-label="Quick create">＋</button><div class="menu" id="m-qc">${qc()}</div></div><button class="ib" onclick="imp()" title="Import" aria-label="Import">⇪</button><button class="ib" onclick="admin()" title="Admin settings" aria-label="Admin settings">⚙</button><div class="dd"><button class="ib" onclick="menu('bl')" title="Notifications" aria-label="Notifications">🔔</button><div class="menu w" id="m-bl">${S.log.slice(0,6).map(l=>`<div class="ni">${esc(l.m)}</div>`).join('')}</div></div><button class="ib" onclick="theme()" title="Switch theme" aria-label="Switch theme">◐</button><div class="dd"><button class="ib av" onclick="menu('us')" aria-label="Account menu">${esc((ME.name||'?')[0].toUpperCase())}</button><div class="menu w" id="m-us"><div class="ni"><b>${esc(ME.name)}</b><br><span class="mut">${esc(ME.email)}</span><br><span class="tag">${isSA()?'Super admin':'User'}</span></div><button onclick="logout()">Sign out</button></div></div>`}
function go(v){if(v=='users'&&!isSA())return;view=v;q='';FL={};SO='new';SHOWF=false;SEL.clear();MODE=v=='deals'?'board':'table';render()}
const CV={home:()=>home(),dashboard:()=>dash(),users:()=>users()};
function render(){nav();bar();document.getElementById('app').innerHTML=`<div class="panel">${CV[view]?CV[view]():page()}</div>`;if(!CV[view])body()}
function home(){const h=new Date().getHours(),t=day(0),pc=pct(),up=S.meetings.filter(m=>m.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5),od=S.tasks.filter(x=>!x.done).slice(0,4);
return `<div class="hero"><h2>Good ${h<12?'morning':h<17?'afternoon':'evening'}</h2><p class="mut">Connect your inbox and calendar to prep for meetings, catch conversations before they are missed and organise your day, right from Home.</p>${Object.keys(S.int).map(k=>`<button class="btn ${S.int[k]?'':'p'}" onclick="tgl('${k}')">${S.int[k]?'✓ '+k+' connected':'Connect '+k}</button>`).join('')}<br><small class="mut">Beta: connections are simulated. Real sync needs a backend with OAuth.</small></div>
<div class="two"><div class="card"><div class="row"><b>Setup guide</b><span class="mut">${pc}% complete</span></div><div class="pg big"><i style="width:${pc}%"></i></div>${steps().map(s=>`<div class="row" style="margin-top:12px"><span>${s[1]?'✓':'○'} ${s[0]}</span>${s[1]?'':`<button class="btn s" onclick="${s[2]}">Start</button>`}</div>`).join('')}</div>
<div class="card"><b>Today’s meetings</b>${up.map(m=>`<div class="row" style="margin-top:12px"><span>${esc(m.title)}<br><small class="mut">${m.date==t?'Today':esc(m.date)} at ${esc(m.time)} with ${esc(m.contact)}</small></span>${m.link?`<a class="btn s" href="https://${esc(m.link)}" target="_blank" rel="noopener">Join</a>`:''}</div>`).join('')||'<p class="mut">No meetings booked yet.</p>'}</div></div>
<div class="card" style="margin-top:12px"><b>Open tasks</b>${od.map(x=>`<div class="row" style="margin-top:10px"><span>${esc(x.title)}</span><small class="mut">${esc(x.due)}</small></div>`).join('')||'<p class="mut">All caught up.</p>'}</div>`}

addEventListener('storage',e=>{if(e.key==UK||e.key==null)chk()});setInterval(chk,10000);
function users(){if(!isSA())return '<div class="empty">Only the super admin can manage users.</div>';const U=getU(),ac=U.filter(x=>x.status=='active').length,kp=(a,b)=>`<div class="card"><span class="mut">${a}</span><div class="kpi">${b}</div></div>`;
return `<div class="hd"><h1>Users &amp; access</h1></div><p class="mut">Only the super admin (${SA_EMAIL}) can disable, enable or delete accounts.</p><div class="grid">${kp('Total accounts',U.length)}${kp('Active',ac)}${kp('Disabled',U.length-ac)}</div><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Last sign-in</th><th></th></tr>${U.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="tag">${u.role=='superadmin'?'Super admin':'User'}</span></td><td><span class="tag ${u.status=='active'?'':'op'}">${u.status=='active'?'Active':'Disabled'}</span></td><td>${fd(u.created)}</td><td>${fd(u.last)}</td><td>${u.role=='superadmin'?'<span class="mut">Protected</span>':`<button class="btn s" onclick="setSt('${u.id}','${u.status=='active'?'disabled':'active'}')">${u.status=='active'?'Disable':'Enable'}</button> <button class="btn s" style="color:var(--bad)" onclick="rmU('${u.id}')">Delete</button>`}</td></tr>`).join('')}</table></div>`}
function setSt(id,st){if(!isSA())return toast('Only the super admin can do this');const U=getU(),u=U.find(x=>x.id==id);if(!u||u.role=='superadmin')return;u.status=st;setU(U);toast(`${u.email} ${st=='active'?'enabled':'disabled'}`);render()}
function rmU(id){if(!isSA())return toast('Only the super admin can do this');const u=getU().find(x=>x.id==id);if(!u||u.role=='superadmin')return;cf(`Delete ${u.email} and all of their data? This cannot be undone.`,()=>{if(!isSA())return;setU(getU().filter(x=>x.id!=id));try{localStorage.removeItem('pravah_crm_'+id)}catch(e){}toast('Account deleted');render()})}
function cf(m,f){CFN=f;ov(`<div class="m"><b style="font-size:17px">Please confirm</b><p>${esc(m)}</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeF()">Cancel</button><button class="btn p" onclick="closeF();CFN()">Confirm</button></div></div>`)}
start();
</script></body></html>
